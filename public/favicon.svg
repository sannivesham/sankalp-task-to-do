<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle with subtle burgundy gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84234F" />
      <stop offset="100%" stop-color="#321724" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C769" />
      <stop offset="100%" stop-color="#D2A33A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative ring -->
  <circle cx="32" cy="32" r="26" stroke="#D2A33A" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Flowing Stylized 'S' that transforms into a decisive completion checkmark -->
  <path d="M42 20C38 16 26 16 23 23C20 30 42 29 39 41C36 50 25 50 18 45" 
        stroke="url(#goldGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)" />
        
  <!-- Resolute checkmark accent stroke -->
  <path d="M28 35L36 43L50 23" 
        stroke="#FAF6EF" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Mini gold bindu / accent dot -->
  <circle cx="45" cy="18" r="2.5" fill="#D2A33A" />
</svg>
